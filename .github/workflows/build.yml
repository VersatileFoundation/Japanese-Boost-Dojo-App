name: Build Japanese Boost Dojo App

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # WINDOWS
  # ============================================================

  build-windows:

    name: Build Windows

    runs-on: windows-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # --------------------------------------------------------
      # NODE.JS
      # --------------------------------------------------------

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:
          node-version: 20
          cache: npm


      # --------------------------------------------------------
      # INSTALL DEPENDENCIES
      # --------------------------------------------------------

      - name: Install dependencies

        run: npm ci


      # --------------------------------------------------------
      # BUILD WINDOWS ELECTRON APPLICATION
      # --------------------------------------------------------

      - name: Build Windows Electron App

        shell: pwsh

        run: |

          npx electron-packager . "Japanese Boost Dojo App" `
            --platform=win32 `
            --arch=x64 `
            --electron-version=32.0.0 `
            --app-version=1.0.0 `
            --overwrite `
            --icon=icon.ico `
            --win32metadata.CompanyName="Versatile Foundation" `
            --win32metadata.FileDescription="Japanese Boost Dojo Practice Desktop App" `
            --win32metadata.OriginalFilename="Japanese Boost Dojo App.exe" `
            --win32metadata.ProductName="Japanese Boost Dojo App" `
            --win32metadata.requested-execution-level="asInvoker"


      # --------------------------------------------------------
      # VERIFY WINDOWS EXECUTABLE
      # --------------------------------------------------------

      - name: Verify Windows executable

        shell: pwsh

        run: |

          $exe =
            "Japanese Boost Dojo App-win32-x64\Japanese Boost Dojo App.exe"

          if (!(Test-Path $exe)) {

            Write-Error `
              "Windows executable was not created."

            exit 1
          }

          Write-Host ""
          Write-Host "Windows executable created:"
          Write-Host $exe
          Write-Host ""

          Get-Item $exe


      # --------------------------------------------------------
      # CREATE PORTABLE ZIP
      # --------------------------------------------------------

      - name: Create Windows Portable ZIP

        shell: pwsh

        run: |

          if (Test-Path "japaneseboostdojoapp_Portable.zip") {

            Remove-Item `
              "japaneseboostdojoapp_Portable.zip" `
              -Force
          }

          Compress-Archive `
            -Path "Japanese Boost Dojo App-win32-x64\*" `
            -DestinationPath "japaneseboostdojoapp_Portable.zip" `
            -CompressionLevel Optimal `
            -Force

          Write-Host ""
          Write-Host "Portable ZIP created."
          Write-Host ""


      # --------------------------------------------------------
      # INSTALL INNO SETUP
      # --------------------------------------------------------

      - name: Install Inno Setup

        shell: pwsh

        run: |

          choco install innosetup -y


      # --------------------------------------------------------
      # BUILD INSTALLER
      # --------------------------------------------------------

      - name: Build Windows Installer

        shell: pwsh

        run: |

          $iscc =
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {

            Write-Error `
              "Inno Setup compiler was not found."

            exit 1
          }

          & $iscc "installer.iss"

          if ($LASTEXITCODE -ne 0) {

            Write-Error `
              "Inno Setup compilation failed."

            exit $LASTEXITCODE
          }


      # --------------------------------------------------------
      # VERIFY INSTALLER
      # --------------------------------------------------------

      - name: Verify Windows Installer

        shell: pwsh

        run: |

          $installer =
            "installer\japaneseboostdojoapp-installer.exe"

          if (!(Test-Path $installer)) {

            Write-Error `
              "Installer was not created: $installer"

            exit 1
          }

          Write-Host ""
          Write-Host "Installer created:"
          Write-Host $installer
          Write-Host ""

          Get-Item $installer


      # --------------------------------------------------------
      # UPLOAD PORTABLE
      # --------------------------------------------------------

      - name: Upload Windows Portable

        uses: actions/upload-artifact@v4

        with:

          name: Japanese-Boost-Dojo-App-Windows-Portable

          path: JapaneseBoostDojoApp_Portable.zip


      # --------------------------------------------------------
      # UPLOAD INSTALLER
      # --------------------------------------------------------

      - name: Upload Windows Installer

        uses: actions/upload-artifact@v4

        with:

          name: Japanese-Boost-Dojo-App-Windows-Installer

          path: installer/Japanese-Boost-Dojo-App-installer.exe


  # ============================================================
  # MACOS
  # ============================================================

  build-macos:

    name: Build macOS

    runs-on: macos-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # --------------------------------------------------------
      # NODE.JS
      # --------------------------------------------------------

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:
          node-version: 20
          cache: npm


      # --------------------------------------------------------
      # INSTALL DEPENDENCIES
      # --------------------------------------------------------

      - name: Install dependencies

        run: npm ci


      # --------------------------------------------------------
      # BUILD UNIVERSAL MACOS APP
      # --------------------------------------------------------

      - name: Build macOS Universal App

        run: |

          npx electron-packager . "Japanese Boost Dojo App" \
            --platform=darwin \
            --arch=universal \
            --electron-version=32.0.0 \
            --app-version=1.0.0 \
            --overwrite \
            --icon=icon.icns


      # --------------------------------------------------------
      # VERIFY MACOS APP
      # --------------------------------------------------------

      - name: Verify macOS app

        run: |

          if [ ! -d \
            "Japanese Boost Dojo App-darwin-universal/Japanese Boost Dojo App.app"
          ]; then

            echo "macOS application was not created."

            exit 1

          fi


      # --------------------------------------------------------
      # CREATE MACOS ZIP
      # --------------------------------------------------------

      - name: Create macOS ZIP

        run: |

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "Japanese Boost Dojo App-darwin-universal/Japanese Boost Dojo App.app" \
            "JapaneseBoostDojoApp_Mac.zip"


      # --------------------------------------------------------
      # UPLOAD MACOS
      # --------------------------------------------------------

      - name: Upload macOS App

        uses: actions/upload-artifact@v4

        with:

          name: Japanese-Boost-Dojo-App-macOS

          path: japaneseboostdojoapp_Mac.zip


  # ============================================================
  # GITHUB RELEASE
  # ============================================================

  release:

    name: Create GitHub Release

    needs:
      - build-windows
      - build-macos

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # WINDOWS PORTABLE
      # --------------------------------------------------------

      - name: Download Windows Portable

        uses: actions/download-artifact@v4

        with:

          name: japaneseboostdojoapp-Windows-Portable

          path: release/windows-portable


      # --------------------------------------------------------
      # WINDOWS INSTALLER
      # --------------------------------------------------------

      - name: Download Windows Installer

        uses: actions/download-artifact@v4

        with:

          name: japaneseboostdojoapp-Windows-Installer

          path: release/windows-installer


      # --------------------------------------------------------
      # MACOS
      # --------------------------------------------------------

      - name: Download macOS

        uses: actions/download-artifact@v4

        with:

          name: japaneseboostdojoapp-macOS

          path: release/macos


      # --------------------------------------------------------
      # SHOW RELEASE FILES
      # --------------------------------------------------------

      - name: Show release files

        run: |

          find release -type f -print


      # --------------------------------------------------------
      # CREATE GITHUB RELEASE
      # --------------------------------------------------------

      - name: Create GitHub Release

        uses: softprops/action-gh-release@v2

        with:

          tag_name: v${{ github.run_number }}

          name: Japanese Boost Dojo App v${{ github.run_number }}

          generate_release_notes: true

          files: |

            release/windows-portable/*.zip

            release/windows-installer/*.exe

            release/macos/*.zip

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}